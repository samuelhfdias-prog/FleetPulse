<div class="login-container">
  <div class="login-card">
    <!-- Logo -->
    <div class="logo-section">
      <img src="assets/Logo Momesso.png" alt="Momesso Logo" class="logo" />
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          class="form-input"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="form-input"
          required
        />
      </div>

      <button type="submit" class="login-button" [disabled]="isLoading || !loginForm.valid">
        {{ isLoading ? 'Autenticando...' : 'Entrar' }}
      </button>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>
    </form>

    <!-- Demo Credentials -->
    <div class="demo-section">
      <p class="demo-title">Credenciais de Demonstração:</p>
      <div class="demo-card">
        <p><strong>ADMIN:</strong> suporte@momesso.ind.br</p>
        <p><strong>Senha:</strong> 123456</p>
      </div>
      <div class="demo-card">
        <p><strong>USER:</strong> gerente@agroforte.com.br</p>
        <p><strong>Senha:</strong> 123456</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p>Momesso Indústria de Máquinas © 2026</p>
      <p>Líder em Tratamento de Sementes Industrial</p>
    </div>
  </div>
</div>
